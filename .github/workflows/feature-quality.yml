name: Controlli PierHouse
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test regole di casa
        run: node --test tests/house-rules.test.mjs
      - name: Verifica build frontend
        run: npm run build
      - name: Verifica Worker senza deploy
        run: npm run backend:check
